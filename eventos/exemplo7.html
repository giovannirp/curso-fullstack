<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            }

            .card {
            background-color: #ffffff;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 300px;
            }

            button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            }

            button:hover {
            background-color: #0056b3;
            }
    </style>
</head>
<body>
    <div class="card">
    <h2>Pergunta surpresa!</h2>
    <p id="resposta">Clique no botão para ver a resposta.</p>
    <button id="btnRevelar">Revelar Resposta</button>
    </div>



    <script>
        const botao = document.querySelector('#btnRevelar')
        const texto = document.querySelector('#resposta')

        botao.addEventListener('click', function() {
            texto.innerHTML = "O JavaScript deixa as páginas dinâmicas!"
            botao.style.display = "none" // Esconde o botão após o clique
        });
    </script>
    
</body>
</html>
