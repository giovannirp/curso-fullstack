<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Eventos JavaScript</title>
</head>
<body>

    <h1>Eventos JavaScript</h1>

    <button type="button" id="btnMsn">
        Clique aqui!
    </button>

    <script>
        document.querySelector('#btnMsn').onclick = function() {
            console.log("Ele clicou!");
        }
    </script>
</body>
</html>
